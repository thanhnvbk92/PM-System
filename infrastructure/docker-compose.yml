version: '3.8'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: pm_system_clickhouse
    ports:
      - "8123:8123" # HTTP Interface
      - "9000:9000" # Native Client Interface
    volumes:
      - ./clickhouse/data:/var/lib/clickhouse
      - ./clickhouse/logs:/var/log/clickhouse-server
      - ./clickhouse/config:/etc/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # We can add other services here later (e.g., Backend, Web)
  # backend:
  #   build: ../backend
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - clickhouse

networks:
  default:
    name: pm_system_network
